services:
  glpi:
    image: glpi/glpi:10.0.28
    restart: unless-stopped
    expose:
      - "80"
    environment:
      TZ: Europe/Paris
      GLPI_DB_HOST: ${GLPI_DB_HOST:-bdd.alexandre-lb.fr}
      GLPI_DB_PORT: "${GLPI_DB_PORT:-3306}"
      GLPI_DB_NAME: ${GLPI_DB_NAME:-glpidb}
      GLPI_DB_USER: ${GLPI_DB_USER:-glpiuser}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?}
      GLPI_SKIP_AUTOINSTALL: "true"
      GLPI_SKIP_AUTOUPDATE: "true"
      GLPI_CRONTAB_ENABLED: "${GLPI_CRONTAB_ENABLED:-0}"
    volumes:
      - type: bind
        source: /data/glpi/data
        target: /var/glpi
        bind:
          create_host_path: false
      - type: bind
        source: /data/glpi/marketplace
        target: /var/www/glpi/marketplace
        bind:
          create_host_path: false
      - type: bind
        source: /data/glpi/plugins
        target: /var/www/glpi/plugins
        bind:
          create_host_path: false
